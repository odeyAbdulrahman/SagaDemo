version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saganet

  sagaorchestrator:
    image: ${DOCKER_REGISTRY-}sagaorchestrator
    build:
      context: .
      dockerfile: SagaOrchestrator/Dockerfile
    networks:
      - saganet
    depends_on:
      rabbitmq:
        condition: service_healthy

  orderservice:
    image: ${DOCKER_REGISTRY-}orderservice
    build:
      context: .
      dockerfile: OrderService/Dockerfile
    networks:
      - saganet
    depends_on:
      rabbitmq:
        condition: service_healthy

  paymentservice:
    image: ${DOCKER_REGISTRY-}paymentservice
    build:
      context: .
      dockerfile: PaymentService/Dockerfile
    networks:
      - saganet
    depends_on:
      rabbitmq:
        condition: service_healthy

  inventoryservice:
    image: ${DOCKER_REGISTRY-}inventoryservice
    build:
      context: .
      dockerfile: InventoryService/Dockerfile
    networks:
      - saganet
    depends_on:
      rabbitmq:
        condition: service_healthy

networks:
  saganet:
    driver: bridge